name: Publish crates.io

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: crates-io-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
      - name: Validate release tag and source
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 .github/scripts/version.py --check-tag "$RELEASE_TAG"
          git merge-base --is-ancestor HEAD origin/master
      - name: Verify release package and stable feature configurations
        run: |
          cargo test --no-default-features
          cargo test --features std
          cargo test --features entities
          cargo publish --dry-run --no-default-features
          cargo publish --dry-run --features entities
      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish verified version
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --no-default-features
