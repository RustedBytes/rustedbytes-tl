name: Update version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: SemVer component (ignored when version is supplied)
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Optional explicit MAJOR.MINOR.PATCH version, without v
        type: string
        required: false

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: update-version
  cancel-in-progress: false

jobs:
  update-version:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
      - name: Prepare version
        id: version
        env:
          VERSION_BUMP: ${{ inputs.bump }}
          EXPLICIT_VERSION: ${{ inputs.version }}
        run: python3 .github/scripts/version.py --bump "$VERSION_BUMP" --version "$EXPLICIT_VERSION"
      - name: Verify version and package
        run: |
          cargo metadata --no-deps --format-version 1 > /dev/null
          cargo package --allow-dirty --no-default-features
          git diff --check
      - name: Create version PR and dispatch CI
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NEW_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          branch="chore/version-$NEW_VERSION"
          git ls-remote --exit-code origin "refs/heads/$branch" "refs/tags/v$NEW_VERSION" > /tmp/version-refs || status=$?
          if test -s /tmp/version-refs; then
            echo "Version branch or tag already exists: $NEW_VERSION" >&2
            exit 1
          fi
          if test "${status:-0}" -ne 2 && test "${status:-0}" -ne 0; then
            echo "Unable to check remote refs" >&2
            exit 1
          fi
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml
          git commit -m "chore: bump version to $NEW_VERSION"
          git push origin "$branch"
          gh pr create --base master --head "$branch" \
            --title "chore: bump version to $NEW_VERSION" \
            --body "Updates Cargo.toml; the library does not track Cargo.lock. Package verification passed. The Rust checks workflow is explicitly dispatched for this branch. Merge this PR before tagging and publishing the GitHub Release."
          gh workflow run ci.yml --ref "$branch"
